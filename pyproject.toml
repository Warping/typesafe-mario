[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typesafe-mario"
version = "0.1.0"
description = "A direct-control Laya agent for Super Mario Bros."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "laya>=0.4.13",
  "torch>=2.11",
]

[project.optional-dependencies]
mario = [
  "gym-super-mario-bros>=9.1.0",
  "gymnasium",
  "nes-py>=9.0.1",
  "numpy>=2.1",
  "pygame>=2.6",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
typesafe-mario = "typesafe_mario.cli:main"

[project.urls]
Repository = "https://github.com/fhshaik/typesafe-mario"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_mario"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.ruff]
line-length = 100
target-version = "py313"
